name: CI

# This workflow runs from the repository root. It was written while the prover
# was still a subdirectory of a larger workspace, where GitHub would not read it,
# so for a long time none of it had ever executed.
#
# Every job below was therefore run by hand on one machine before the first push,
# and cppcheck FAILED -- eight findings that had accumulated unseen precisely
# because the job that would have reported them had never run. Four were real and
# fixed; two were deliberate and are now in .cppcheck-suppressions with reasons.
# Untested CI configuration is not the same thing as passing CI, and the gap
# between them was eight findings wide.

# Runs on every push to master and on pull requests; can be started by hand.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
          - os: windows-latest
            compiler: mingw

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install verification dependency
        # python-chess enables the independent PV replay and proof-certificate
        # verification layer. Without it those tests skip rather than fail.
        run: python -m pip install --upgrade "chess>=1.10"

      - name: Select compiler
        if: matrix.compiler == 'clang' && runner.os == 'Linux'
        run: echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install MinGW-w64
        # The MinGW toolchain is the one the AVX alignment fault of section 79
        # appeared on, and it was the only supported platform with no CI job --
        # the README could claim it was tested only because it was tested by
        # hand. Chocolatey rather than a third-party action, to keep the set of
        # things trusted by this workflow as small as it already is.
        if: matrix.compiler == 'mingw'
        run: choco install mingw -y --no-progress

      - name: Configure
        if: matrix.compiler != 'mingw'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (MinGW)
        # An explicit generator: on a Windows runner CMake defaults to Visual
        # Studio, which would silently build with MSVC and test nothing new.
        if: matrix.compiler == 'mingw'
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  native-flags:
    # Every other gate in this repository tests a BINARY. None of them test a
    # BUILD, so the compiler sits outside the system under test -- and that is
    # precisely where the fault of section 79 lived: `-march=native` on MinGW
    # produced an engine that segfaulted inside move generation, on source that
    # is correct and that every existing job passes. `-march=native` is also the
    # first flag anyone adds to a chess engine, so it is not an exotic
    # configuration to leave uncovered.
    #
    # This job builds with architecture-specific flags on every supported
    # platform and RUNS the full suite, because the failure was at runtime in
    # perft rather than at compile time. The MinGW leg is the regression test
    # for the guard in CMakeLists.txt: delete that guard and this job fails.
    name: native flags / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            flags: "-march=native"
          - name: linux-clang
            os: ubuntu-latest
            flags: "-march=native"
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            # macos-latest is arm64, where clang rejects -march=native; -mcpu is
            # the spelling that means the same thing there.
            flags: "-mcpu=native"
          - name: windows-msvc
            os: windows-latest
            # MSVC has no -march; /arch:AVX2 is the equivalent request, and the
            # same class of instruction-selection change.
            flags: "/arch:AVX2"
          - name: windows-mingw
            os: windows-latest
            flags: "-march=native"
            mingw: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade "chess>=1.10"

      - name: Select compiler
        if: matrix.cxx != ''
        run: echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Install MinGW-w64
        if: matrix.mingw
        run: choco install mingw -y --no-progress

      - name: Configure
        if: '!matrix.mingw'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Configure (MinGW)
        if: matrix.mingw
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  bounds-checked:
    name: bounds-checked run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "chess>=1.10"
      - name: Build with libstdc++ debug containers
        # The nearest thing to a sanitiser that is available everywhere:
        # _GLIBCXX_ASSERTIONS bounds-checks std::array and std::vector
        # operator[], and _GLIBCXX_DEBUG adds iterator validity checks. The
        # search indexes a std::array<char, 64> with plain ints throughout, so
        # this is the check that says those indices are in range on every path
        # the suite exercises.
        run: |
          g++ -std=c++17 -O1 -g -D_GLIBCXX_DEBUG -D_GLIBCXX_ASSERTIONS               -Wall -Wextra -pedantic -pthread -o /tmp/mateprover_checked src/mateprover.cpp
      - name: Run the full suite under bounds checking
        # --slow-build stands the wall-clock assertions down. _GLIBCXX_DEBUG at
        # -O1 is roughly fifty times slower than the shipped build, so a 0.5 s
        # budget legitimately takes 7.5 s here -- which says something about the
        # instrumentation and nothing about the engine. Every other check still
        # runs; it is the bounds checking this job exists for.
        run: python tests/run_tests.py --engine /tmp/mateprover_checked --slow-build

  future-standards:
    name: c++20 and c++23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile under newer standards
        # Not a promise to support them, a canary: newer standards reject
        # constructs quietly tolerated by C++17, which is the cheapest available
        # approximation of a second front end.
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic -Werror -pthread -fsyntax-only src/mateprover.cpp
          g++ -std=c++23 -O2 -Wall -Wextra -pedantic -Werror -pthread -fsyntax-only src/mateprover.cpp

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyse
        # An independent opinion, not a second run of the compiler's. Findings
        # deliberately declined are listed in .cppcheck-suppressions with
        # reasons; anything else is a finding to act on, so the run must be
        # silent. --error-exitcode makes a finding fail the job.
        run: |
          cppcheck --enable=warning,performance,portability,style                    --std=c++17 --check-level=exhaustive                    --suppressions-list=.cppcheck-suppressions                    --error-exitcode=1 --quiet src/mateprover.cpp

  warnings-are-errors:
    name: strict warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with -Werror
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -pthread \
              -o /tmp/mateprover src/mateprover.cpp
          echo "" | /tmp/mateprover --perft 4
