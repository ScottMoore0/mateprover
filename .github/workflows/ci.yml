name: CI

# Note: this workflow lives under chest-e/ so that it is already in place when
# the prover is extracted into its own repository. GitHub only reads workflows
# from the repository root, so it does not run while chest-e is a subdirectory.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        # python-chess enables the independent PV replay and proof-certificate
        # verification layer. Without it those tests skip rather than fail.
        run: python -m pip install --upgrade "chess>=1.10"

      - name: Select compiler
        if: matrix.compiler == 'clang' && runner.os == 'Linux'
        run: echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyse
        # An independent opinion, not a second run of the compiler's. Findings
        # deliberately declined are listed in .cppcheck-suppressions with
        # reasons; anything else is a finding to act on, so the run must be
        # silent. --error-exitcode makes a finding fail the job.
        run: |
          cppcheck --enable=warning,performance,portability,style                    --std=c++17 --check-level=exhaustive                    --suppressions-list=.cppcheck-suppressions                    --error-exitcode=1 --quiet src/echest.cpp

  warnings-are-errors:
    name: strict warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with -Werror
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Werror -pthread \
              -o /tmp/echest src/echest.cpp
          echo "" | /tmp/echest --perft 4
